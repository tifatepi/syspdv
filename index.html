    <style>
      /* Estilos de Impressão */
      @media print {
        /* Se for o cupom fiscal (identificado pela classe print-content no PDV) */
        .print-content {
          width: 80mm !important;
          margin: 0 !important;
          padding: 5mm !important;
        }

        /* Se for um relatório geral (identificado por não ser print-content) */
        body:not(:has(.print-content)) {
          width: 210mm; /* A4 width */
          height: auto;
          background: white !important;
          padding: 10mm;
        }

        .no-print, .no-print * { 
          display: none !important; 
        }
        
        .print-only { 
          display: block !important; 
        }
        
        #root { 
          display: block !important; 
        }

        /* Forçar cores na impressão */
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        /* Evitar quebra de cards ao meio */
        .break-inside-avoid {
          page-break-inside: avoid;
          break-inside: avoid;
        }
      }

      /* No navegador (tela), não mostra o conteúdo de impressão */
      .print-only { display: none; }
      
      /* Custom Scrollbar */
      .custom-scrollbar::-webkit-scrollbar { width: 8px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #555; }

      /* Touch active state feedback */
      .btn-touch-active:active { transform: scale(0.95); opacity: 0.8; }
    </style>
