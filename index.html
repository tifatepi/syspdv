
<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>QuickTouch POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Estilos de Impressão (Impressora Térmica 80mm) */
      @media print {
        @page {
          margin: 0;
          size: 80mm auto;
        }
        
        /* Oculta elementos que não devem sair no papel */
        .no-print, .no-print * { 
          display: none !important; 
        }
        
        /* Garante que o container de impressão apareça */
        .print-only { 
          display: block !important; 
        }
        
        body { 
          width: 80mm; 
          margin: 0; 
          padding: 0; 
          background-color: white !important;
          color: black !important;
          font-family: 'Courier New', Courier, monospace;
        }

        /* Corrigido: Não podemos esconder o #root pois o React está dentro dele */
        #root { 
          display: block !important; 
        }

        /* Ajustes finos para garantir que o recibo ocupe a largura correta */
        .print-content {
          display: block !important;
          width: 80mm !important;
          padding: 10px !important;
          box-sizing: border-box !important;
        }
      }

      /* No navegador (tela), não mostra o conteúdo de impressão */
      .print-only { display: none; }
      
      /* Custom Scrollbar */
      .custom-scrollbar::-webkit-scrollbar { width: 8px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #555; }

      /* Touch active state feedback */
      .btn-touch-active:active { transform: scale(0.95); opacity: 0.8; }
    </style>
